services:
  employee:
    image: ${DOCKER_REGISTRY-}employee
    container_name: employee-Api
    build:
      context: .
      dockerfile: Employee/Dockerfile
    ports:
        - "8080:8080"
    environment:
        - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EmployeeDb;User Id=sa;Password=Qwerty123%;TrustServerCertificate=True
    depends_on:
        - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-sql
    environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_Password: "Qwerty123%"
    ports:
        - "1433:1433"
    volumes:
        - sql_data:/var/opt/mssql

  angular:
    build:
      context: ../EmployeeUI
      dockerfile: Dockerfile
    container_name: employee-ui
    ports:
      - "4200:80"
    depends_on:
      - employee
        
volumes:
  sql_data:
